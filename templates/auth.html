<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Learning Room ♡ — Account</title>
<style>
:root{--pink:#f8edf1;--rose:#c49aaa;--ink:#63565d;--muted:#9c8e95;--line:#e8dce1;--white:#fffdfd}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f8;color:var(--ink);font:15px/1.6 Arial,sans-serif;padding:20px}.card{width:min(100%,430px);background:var(--white);border:1px solid var(--line);padding:30px;border-radius:12px;box-shadow:0 10px 35px #e8dce155}.bow{text-align:center;color:var(--rose);font-size:22px}.brand{text-align:center;font-size:22px;font-weight:bold;letter-spacing:1px}.brand span{color:var(--rose)}p.muted{text-align:center;color:var(--muted);margin:4px 0 22px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs a{flex:1;text-align:center;padding:9px;border:1px solid var(--line);border-radius:8px}.tabs a.active{background:var(--pink);border-color:var(--rose)}label{display:block;margin:13px 0 5px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;background:#fff}button{width:100%;margin-top:20px;padding:12px;border:1px solid var(--rose);border-radius:8px;background:var(--pink);color:var(--ink);font-weight:bold;cursor:pointer}.error{background:#fff0f0;color:#9a4040;padding:10px;border-radius:7px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style></head><body><main class="card"><div class="bow">୨୧ ♡ ୨୧</div><div class="brand">THE LEARNING <span>ROOM</span></div><p class="muted">a little place to bloom ♡</p><nav class="tabs"><a href="/auth" class="{{ 'active' if mode != 'register' else '' }}">Log in</a><a href="/auth?mode=register" onclick="event.preventDefault();document.getElementById('mode').value='register';document.getElementById('nameField').hidden=false;document.getElementById('submit').textContent='Create account ♡';document.getElementById('loginTab').classList.remove('active');document.getElementById('registerTab').classList.add('active');">Register</a></nav>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/auth"><input type="hidden" id="mode" name="mode" value="{{ mode }}"><div id="nameField" {% if mode != 'register' %}hidden{% endif %}><label for="name">Display name</label><input id="name" name="name" maxlength="50" autocomplete="name" {% if mode == 'register' %}required{% endif %}></div><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required autocomplete="current-password"><button id="submit" type="submit">{{ 'Create account ♡' if mode == 'register' else 'Log in ♡' }}</button></form><div class="foot">Your little study space, saved on this device.</div></main>
<script>const mode=document.getElementById('mode');const nameField=document.getElementById('nameField');const submit=document.getElementById('submit');const tabs=document.querySelectorAll('.tabs a');function setMode(m){mode.value=m;nameField.hidden=m!=='register';document.getElementById('name').required=m==='register';submit.textContent=m==='register'?'Create account ♡':'Log in ♡';tabs[0].classList.toggle('active',m!=='register');tabs[1].classList.toggle('active',m==='register')}tabs[0].addEventListener('click',e=>{e.preventDefault();setMode('login')});tabs[1].addEventListener('click',e=>{e.preventDefault();setMode('register')});setMode(mode.value);</script></body></html>
